<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBE | Advanced 3D Interactive Portal</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Global 3D Space */
        body { 
            background: radial-gradient(circle at center, #0f172a, #020617); 
            min-height: 100vh; 
            perspective: 1000px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1. Dynamic Marquee Animation */
        @keyframes hueShift {
            0% { color: #ff007f; text-shadow: 0 0 15px #ff007f; }
            33% { color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
            66% { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff007f; text-shadow: 0 0 15px #ff007f; }
        }
        .dynamic-marquee { animation: hueShift 4s infinite linear; }

        /* 2. Glassmorphism & 3D Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotateY(-5deg) rotateX(2deg);
            transition: all 0.5s ease;
        }
        .glass-card:hover { transform: rotateY(0deg) rotateX(0deg) scale(1.02); }

        /* 3. Hue-Rotating 3D Border Box */
        @keyframes rotateBorder {
            0% { border-color: #ff007f; box-shadow: 0 0 15px #ff007f; }
            50% { border-color: #00f0ff; box-shadow: 0 0 15px #00f0ff; }
            100% { border-color: #ff007f; box-shadow: 0 0 15px #ff007f; }
        }
        .hue-box {
            border: 3px solid;
            animation: rotateBorder 5s infinite linear;
            background: #000;
        }

        /* 4. Text 3D Depth */
        .depth-text { text-shadow: 3px 3px 0px #003366, 6px 6px 0px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header Section -->
    <header class="mb-12">
        <marquee class="text-4xl md:text-6xl font-black dynamic-marquee italic">
            #ALOO KA PRANTHA!!! &nbsp;&nbsp; #ALOO KA PRANTHA!!! &nbsp;&nbsp; #ALOO KA PRANTHA!!!
        </marquee>
        <h1 class="text-center text-2xl md:text-4xl font-bold mt-6 depth-text text-cyan-400">
            INDIAN COUNCIL OF BOARD EXAMINATIONS
        </h1>
    </header>

    <main class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
        
        <!-- Authentication Block -->
        <section class="glass-card p-10 rounded-3xl">
            <h2 class="text-2xl font-bold mb-6 text-white">Candidate Verification</h2>
            <form id="pvrLogin" class="space-y-5">
                <input type="text" id="roll" placeholder="Roll Number" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:ring-2 ring-cyan-500 transition-all">
                <input type="text" id="school" placeholder="School Code" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:ring-2 ring-cyan-500 transition-all">
                <input type="password" id="passcode" placeholder="Enter Passcode: 2078" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:ring-2 ring-cyan-500 transition-all">
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 p-4 rounded-xl font-bold text-lg hover:shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all">
                    PROCEED
                </button>
            </form>
            <div id="resultsArea" class="hidden mt-6 p-4 rounded-xl border border-green-500/30 bg-green-900/20 text-center font-bold"></div>
        </section>

        <!-- Dynamic Business Idea Box -->
        <aside class="hue-box p-8 rounded-3xl transform hover:scale-105 transition-all">
            <h3 class="text-2xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-cyan-400">
                ICSE WALON Business Idea
            </h3>
            <div class="space-y-3 font-mono text-sm">
                <p>• Samosa Plate: 10 Rs</p>
                <p>• Extra Chutney: Free</p>
                <p>• Chai: 5 Rs</p>
                <p>• Combo: 15 Rs</p>
            </div>
            <div class="mt-6 h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-pink-500 to-cyan-500 animate-pulse w-full"></div>
            </div>
        </aside>
    </main>

    <footer class="text-center mt-20 text-slate-500 text-sm">
        ICBE Portal 2026 | Secured Verification Gateway
    </footer>

    <script>
        document.getElementById('pvrLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('passcode').value;
            if (pass === "2078") {
                const res = document.getElementById('resultsArea');
                res.classList.remove('hidden');
                res.innerHTML = "STATUS: VERIFIED SUCCESSFUL - AUTHORIZED ACCESS";
            } else {
                alert("Security Error: Invalid Passcode.");
            }
        });
    </script>
</body>
</html>
